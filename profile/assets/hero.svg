<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">OJAK — CG&amp;I × KAIST 2026 XR·AI 윈터스쿨 Team T14</title>
  <desc id="desc">1:1 대면 대화 중 질문이 들어온 순간, 중심 시야(아이컨택)를 가리지 않고 Rokid 단색 그린 HUD 안전 영역에 근거 있는 한 줄만 띄우는 OJAK 시야 다이어그램.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#091114"/>
      <stop offset="0.55" stop-color="#0d1b1e"/>
      <stop offset="1" stop-color="#0c201a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00ff7f"/>
      <stop offset="0.6" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lensBg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0f2326" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a1617" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#5eead4" opacity=".09"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1120" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1120" height="340" rx="20" fill="url(#grid)"/>
  <path d="M0 338.5H1120" stroke="url(#accent)" stroke-width="3"/>

  <g font-family="'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Left Column: Identity & Context -->
    <rect x="44" y="38" width="24" height="4" rx="2" fill="#00ff7f"/>
    <text x="78" y="45" font-size="13.5" font-weight="600" letter-spacing="0.4" fill="#8fd3c1">CG&amp;I × KAIST 2026 XR·AI 윈터스쿨 · Team T14 (A × 2)</text>

    <!-- Title + OJAK Bridge Mark -->
    <text x="42" y="132" font-size="74" font-weight="800" letter-spacing="-2" fill="#f3fbf7">OJAK</text>
    <g transform="translate(258, 91) scale(1.95)">
      <g transform="translate(-5, -8)">
        <path fill="#00ff7f" opacity="0.92" d="M23.4311 11.1C23.3578 11.025 23.2844 11 23.2111 11H8.78889C8.71556 11 8.64222 11.025 8.56889 11.1L7.29779 12.4C7.22446 12.475 7.2 12.55 7.2 12.625V15.7C7.2 15.875 7.32222 16 7.49333 16H24.5067C24.6778 16 24.8 15.875 24.8 15.7V12.625C24.8 12.55 24.7755 12.475 24.7022 12.4L23.4311 11.1ZM5 24.7V11.625C5 11.225 5.14667 10.85 5.44001 10.55L7.49333 8.45C7.78666 8.15 8.15334 8 8.54445 8H23.4555C23.8467 8 24.2133 8.15 24.5067 8.45L26.56 10.55C26.8533 10.85 27 11.225 27 11.625V24.7C27 24.875 26.8778 25 26.7067 25H23.6267C23.4555 25 23.3333 24.875 23.3333 24.7V22.125C23.3333 22.05 23.3578 21.975 23.4311 21.9L24.7022 20.6C24.7755 20.525 24.8 20.45 24.8 20.375V19.3C24.8 19.125 24.6778 19 24.5067 19H7.49333C7.32222 19 7.2 19.125 7.2 19.3V20.375C7.2 20.45 7.22446 20.525 7.29779 20.6L8.56889 21.9C8.64222 21.975 8.66667 22.05 8.66667 22.125V24.7C8.66667 24.875 8.54446 25 8.37334 25H5.29333C5.12222 25 5 24.875 5 24.7Z"/>
        <path fill="#00ff7f" opacity="0.92" d="M14 10V16H12V10H14Z"/>
        <path fill="#00ff7f" opacity="0.92" d="M20 10V16H18V10H20Z"/>
      </g>
    </g>
    <text x="314" y="114" font-size="15" font-weight="600" fill="#7ecbb0">오작 · 시선을 잇는 다리</text>

    <!-- Tagline -->
    <text x="44" y="184" font-size="22" font-weight="650" fill="#e6f6f0">질문이 들어온 순간, 내 기억에서 한 줄만.</text>
    <text x="44" y="217" font-size="22" font-weight="650" fill="#b4dcd0">근거가 없으면 시야를 비워 둡니다.</text>

    <!-- Context Pills -->
    <g font-size="12.5" font-weight="600" fill="#a7f3d0" text-anchor="middle">
      <rect x="44" y="266" width="108" height="30" rx="15" fill="#112c27" stroke="#245d50"/>
      <text x="98" y="285.5">1:1 대면 대화</text>
      <rect x="162" y="266" width="136" height="30" rx="15" fill="#112c27" stroke="#245d50"/>
      <text x="230" y="285.5">Rokid Green HUD</text>
      <rect x="308" y="266" width="88" height="30" rx="15" fill="#112c27" stroke="#245d50"/>
      <text x="352" y="285.5">AIR4BTS</text>
      <rect x="406" y="266" width="104" height="30" rx="15" fill="#112c27" stroke="#245d50"/>
      <text x="458" y="285.5">PACES 가드</text>
    </g>

    <!-- Right Column: First-Person Rokid Glasses Optical Viewfinder (Zero-UI + 3 PACES Outcomes) -->
    <!-- Outer Glasses Lens Frame -->
    <rect x="556" y="28" width="522" height="284" rx="22" fill="url(#lensBg)" stroke="#24534d" stroke-width="1.5"/>

    <!-- Optical Viewfinder Corner Brackets -->
    <g stroke="#00ff7f" stroke-width="2" fill="none" opacity="0.75">
      <path d="M572 52V40h12"/>
      <path d="M1050 40h12v12"/>
      <path d="M572 288v12h12"/>
      <path d="M1050 300h12v-12"/>
    </g>

    <!-- Top Status Strip inside Glasses Viewport -->
    <circle cx="590" cy="54" r="4" fill="#00ff7f"/>
    <text x="602" y="58" font-size="12" font-weight="600" fill="#a7f3d0">Rokid 1인칭 시야 · 중심 시야 차폐 0%</text>
    <rect x="902" y="42" width="150" height="22" rx="11" fill="#12312a" stroke="#266454"/>
    <text x="977" y="57" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">로컬 Whisper · 원음 비저장</text>

    <!-- Central Foveal Vision Protected Zone (Eye Contact Scene) -->
    <rect x="580" y="76" width="474" height="106" rx="14" fill="#0b181a" stroke="#2d665c" stroke-dasharray="5 4" stroke-width="1.2"/>
    <text x="600" y="96" font-size="11.5" font-weight="700" fill="#5eead4">중심 시야 보호 구역 (Central Fovea — 아이컨택 유지)</text>

    <!-- Minimalist Face-to-Face / Partner Speech Illustration -->
    <g transform="translate(598, 108)">
      <!-- Conversation Partner Silhouette -->
      <circle cx="24" cy="18" r="12" fill="#163833" stroke="#4fd1c5" stroke-width="1.5"/>
      <path d="M6 52c0-10 8-16 18-16s18 6 18 16" fill="#163833" stroke="#4fd1c5" stroke-width="1.5"/>
      <!-- Speech Bubble -->
      <rect x="54" y="6" width="234" height="44" rx="12" fill="#132d2b" stroke="#2b6b5e"/>
      <text x="68" y="25" font-size="12" font-weight="600" fill="#e6fffa">"이 팀은 몇 명인가요?"</text>
      <text x="68" y="41" font-size="10.5" fill="#81e6d9">질문 감지 → 세션 기억 검색 + 추출식 가드 검사</text>
    </g>

    <!-- Zero-UI Indicator Badge inside Central Zone -->
    <rect x="898" y="118" width="140" height="42" rx="10" fill="#0e2421" stroke="#234e47"/>
    <text x="968" y="136" font-size="11.5" font-weight="700" fill="#99f6e4" text-anchor="middle">평소 HUD 비움</text>
    <text x="968" y="151" font-size="10.5" fill="#5eead4" text-anchor="middle">폰·노트북 시선 이탈 0</text>

    <!-- Lower Safe Eyebox HUD Zone: 3 PACES Outcomes -->
    <text x="580" y="202" font-size="11.5" font-weight="700" fill="#86efac">시선 하단 안전 영역 (Rokid 단색 그린 HUD 1줄 출력 · 3가지 결과)</text>

    <!-- Outcome 1: Transfer (Answer) -->
    <rect x="580" y="212" width="152" height="82" rx="12" fill="#0d2b20" stroke="#00ff7f" stroke-width="1.5"/>
    <circle cx="595" cy="230" r="4" fill="#00ff7f"/>
    <text x="605" y="234" font-size="11.5" font-weight="700" fill="#4ade80">답 (Transfer)</text>
    <rect x="590" y="244" width="132" height="24" rx="6" fill="#071a12" stroke="#166534"/>
    <text x="656" y="260" font-size="11.5" font-weight="700" fill="#00ff7f" text-anchor="middle">XR 플랫폼팀 6명</text>
    <text x="656" y="283" font-size="10" fill="#86efac" text-anchor="middle">인용 기록 조각 그대로</text>

    <!-- Outcome 2: Restrict (Safe Line) -->
    <rect x="741" y="212" width="152" height="82" rx="12" fill="#231d10" stroke="#f59e0b" stroke-width="1.3"/>
    <circle cx="756" cy="230" r="4" fill="#fbbf24"/>
    <text x="766" y="234" font-size="11.5" font-weight="700" fill="#fcd34d">주의 (Restrict)</text>
    <rect x="751" y="244" width="132" height="24" rx="6" fill="#171209" stroke="#78350f"/>
    <text x="817" y="260" font-size="10.8" font-weight="700" fill="#fbbf24" text-anchor="middle">처우는 인사팀 별도 안내</text>
    <text x="817" y="283" font-size="10" fill="#fde68a" text-anchor="middle">비공개 값 모델 미노출</text>

    <!-- Outcome 3: Non-Transfer (Silence) -->
    <rect x="902" y="212" width="152" height="82" rx="12" fill="#0e181b" stroke="#334e54" stroke-dasharray="4 3" stroke-width="1.2"/>
    <circle cx="917" cy="230" r="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="927" y="234" font-size="11.5" font-weight="700" fill="#cbd5e1">침묵 (Silent)</text>
    <rect x="912" y="244" width="132" height="24" rx="6" fill="#091012" stroke="#263b40"/>
    <text x="978" y="260" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">( 빈 화면 유지 )</text>
    <text x="978" y="283" font-size="10" fill="#94a3b8" text-anchor="middle">근거 없음 · 지어내지 않음</text>
  </g>
</svg>
